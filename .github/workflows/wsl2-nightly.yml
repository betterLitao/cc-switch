name: WSL2 Nightly

# The full backend suite takes 50+ minutes on a \\wsl.localhost 9P filesystem,
# so it runs nightly instead of per PR. The per-PR gate in ci.yml only runs the
# atomic-write contract test against the same WSL2-backed environment.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 Beijing time
  workflow_dispatch:

jobs:
  backend-windows-wsl2-full:
    name: Backend Full Suite (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        shell: pwsh
        run: |
          $nativeTemp = Join-Path $env:RUNNER_TEMP "cc-switch-native-temp"
          New-Item -ItemType Directory -Force -Path $nativeTemp | Out-Null
          $env:TEMP = $nativeTemp
          $env:TMP = $nativeTemp

          $compileOutput = @(& cargo test --tests --manifest-path src-tauri/Cargo.toml --no-run --message-format=json-render-diagnostics 2> cargo-build-errors.log)
          $compileExitCode = $LASTEXITCODE
          if ($compileExitCode -ne 0) {
            if (Test-Path -LiteralPath "cargo-build-errors.log") {
              Get-Content -LiteralPath "cargo-build-errors.log" | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            }
            $compileOutput | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            exit $compileExitCode
          }

          $testBinaries = @(
            foreach ($line in $compileOutput) {
              try {
                $message = ([string]$line).Trim() | ConvertFrom-Json
              } catch {
                continue
              }
              if (
                $message.reason -eq "compiler-artifact" -and
                $message.profile.test -eq $true -and
                -not [string]::IsNullOrWhiteSpace([string]$message.executable)
              ) {
                [string]$message.executable
              }
            }
          ) | Sort-Object -Unique

          if ($testBinaries.Count -eq 0) {
            throw "No test executables were reported by cargo"
          }
          ConvertTo-Json -InputObject $testBinaries -Compress |
            Set-Content -LiteralPath "wsl-test-binaries.json" -Encoding utf8

      - name: Run Windows-to-WSL2 filesystem contract
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testBinaries = @(Get-Content -LiteralPath "wsl-test-binaries.json" -Raw | ConvertFrom-Json)
          $testBinary = $testBinaries |
            Where-Object { (Split-Path -Leaf $_) -like "cc_switch_lib-*.exe" } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$testBinary)) {
            throw "The cc_switch_lib test executable was not recorded"
          }
          $testList = & $testBinary --ignored --list
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $testBinary $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run full test suite against WSL2-backed home
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testBinaries = @(Get-Content -LiteralPath "wsl-test-binaries.json" -Raw | ConvertFrom-Json)
          if ($testBinaries.Count -eq 0) {
            throw "No recorded test executables are available"
          }
          foreach ($testBinary in $testBinaries) {
            Write-Host "Running test executable: $testBinary"
            & $testBinary --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
